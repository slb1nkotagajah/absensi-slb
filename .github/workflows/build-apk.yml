name: Build & Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          echo "JAVA_HOME: $JAVA_HOME"
          java -version
          JAVA_VERSION_OUTPUT=$(java -version 2>&1 | head -n 1)
          echo "Raw Java version string: $JAVA_VERSION_OUTPUT"
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Active Java major version could not be detected."
            exit 1
          fi
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version is $JAVA_MAJOR, which is lower than the required version 17."
            exit 1
          fi
          echo "Java environment verified successfully: Java $JAVA_MAJOR (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          echo "Checking for ./debug.keystore..."
          if [ -f "./debug.keystore" ]; then
            echo "Keystore ./debug.keystore already exists. Reusing existing file."
          else
            echo "Keystore ./debug.keystore not found. Generating temporary debug keystore using keytool..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: ./debug.keystore does not exist after generation attempt."
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "Verifying debug APK at: $EXPECTED_APK"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "ERROR: Expected APK not found at $EXPECTED_APK."
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 4 -name "*.apk" -print
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: $EXPECTED_APK exists but is empty (0 bytes)."
            exit 1
          fi

          case "$EXPECTED_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $EXPECTED_APK does not have the .apk extension."
              exit 1
              ;;
          esac

          APK_SIZE=$(stat -c%s "$EXPECTED_APK" 2>/dev/null || stat -f%z "$EXPECTED_APK")
          echo "Confirmed valid APK: $EXPECTED_APK ($APK_SIZE bytes)."

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ]; then
            echo "ERROR: Verified APK $EXPECTED_APK is missing or empty."
            exit 1
          fi

          RELEASE_DIR="${{ runner.temp }}/apk-release-asset"
          mkdir -p "$RELEASE_DIR"

          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "$REPO_NAME" ]; then
            REPO_NAME="android-app"
          fi

          ASSET_FILENAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          TARGET_PATH="${RELEASE_DIR}/${ASSET_FILENAME}"

          cp "$EXPECTED_APK" "$TARGET_PATH"

          if [ ! -f "$TARGET_PATH" ] || [ ! -s "$TARGET_PATH" ]; then
            echo "ERROR: Failed to prepare release asset at $TARGET_PATH."
            exit 1
          fi

          echo "Prepared release asset: $TARGET_PATH"
          echo "asset_path=${TARGET_PATH}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_FILENAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Verifying GitHub CLI availability..."
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Release asset $ASSET_PATH is not a valid non-empty file."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Release asset $ASSET_PATH does not have the .apk extension."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          RELEASE_NOTES=$(cat <<EOF
          ## AbsenWA Guru - Debug APK Build #${{ github.run_number }}

          This is an automatically generated debug APK built by GitHub Actions.

          - **Workflow Run Number:** ${{ github.run_number }}
          - **Workflow Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit SHA:** ${{ github.sha }}
          - **Build Type:** Debug APK (assembled via Gradle 9.3.1)
          - **Signing:** Signed only with a temporary debug keystore

          > **Note:** This APK is intended for testing and demonstration purposes. It is not a production release for the Google Play Store.
          EOF
          )

          echo "Creating GitHub Release with tag: $RELEASE_TAG and target: ${{ github.sha }}..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

          echo "Release successfully created with tag $RELEASE_TAG."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          echo "=== APK Release & Download Summary ==="
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "GitHub Release publishing succeeded!"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Asset Filename: $ASSET_NAME"

            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url' 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}")
            echo "Release URL: $RELEASE_URL"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Debug APK Build & Release Succeeded

          - **Release Title:** ${RELEASE_TITLE}
          - **Release Tag:** \`${RELEASE_TAG}\`
          - **Direct Release Page:** [View Release and Download APK](${RELEASE_URL})
          - **Release Asset:** \`${ASSET_NAME}\`

          ### 📱 How to Download on your Phone:
          1. Open the [GitHub Release Page](${RELEASE_URL}).
          2. Under the **Assets** section, tap on **\`${ASSET_NAME}\`** to download the APK directly to your phone.
          3. Tap the downloaded file to install and test the app.

          > **Backup Artifact:** The standard GitHub Actions workflow artifact **\`app-debug-apk\`** is also available under the workflow run summary as a backup.
          EOF
          else
            echo "WARNING: GitHub Release publishing failed or was skipped."
            echo "The debug APK build and GitHub Actions artifact upload succeeded."
            echo "Artifact named 'app-debug-apk' remains available for download."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ⚠️ Debug APK Built Successfully (Release Publishing Warning)

          The debug APK was built successfully and is preserved as a GitHub Actions artifact.

          - **Artifact Name:** \`app-debug-apk\`
          - **File:** \`app/build/outputs/apk/debug/app-debug.apk\`
          - **Status:** Available for download in the Artifacts section of this workflow run.

          > **Notice:** GitHub Release publication encountered an error or lacked repository release permissions, but the built APK was not lost and is downloadable from the Actions Artifacts above.
          EOF
          fi
